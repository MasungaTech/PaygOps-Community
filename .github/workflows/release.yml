name: Build and Release

on:
  push:
    tags:
      - '*'

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Extract tag name
        id: tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Tag name: $TAG_NAME"
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker image (for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/masungatech/paygops-community:${{ steps.tag.outputs.tag }}
          build-args: |
            curr_version=${{ steps.tag.outputs.tag }}
            commit_sha=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run tests in container
        run: |
          docker run --rm \
            -e ENV_VAR=TEST \
            -e AUTOMATED_TESTING=1 \
            ghcr.io/masungatech/paygops-community:${{ steps.tag.outputs.tag }} \
            test
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/masungatech/paygops-community:${{ steps.tag.outputs.tag }}
            ghcr.io/masungatech/paygops-community:latest
          build-args: |
            curr_version=${{ steps.tag.outputs.tag }}
            commit_sha=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

